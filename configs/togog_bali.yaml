project:
  name: RaDe-GS
  dataset: Dataset Togog Bali
dataset:
  root: /home/pande/projects/RaDe-GS/dataset/togog_bali
output:
  root: output/togog_bali
results:
  csv: /home/pande/projects/RaDe-GS/research_results/experiment_results.csv
colmap:
  executable: colmap
  camera_model: OPENCV
  use_gpu: true
training:
  extra_args: []
rendering:
  enabled: true
  extra_args: []
image_metrics:
  enabled: true
mesh:
  enabled: true
  resolution: 2
  num_cluster: 8
  depth_ratio: 0.5
  extra_args: []
resource_monitor:
  interval_seconds: 5.0
resource_guard:
  enabled: true
  cooldown_before_mesh_seconds: 5
  minimum_free_ram_gb: 4
  minimum_free_vram_mb: 1024
  wait_if_memory_low: true
  check_interval_seconds: 10
  max_wait_seconds: 300
geometry_evaluation:
  enabled: false
  gt_root: null
  sample_points: 100000
  distance_threshold: null
  seed: 0
