# Scaffold anchor initialization; sesuaikan path repository/interpreter server.
project:
  name: RaDe-GS
  dataset: Tanks and Temples
dataset:
  root: /home/pande/projects/RaDe-GS/dataset/tanks_temples
output:
  root: output/hasil_radegs_v2/scaffold_anchor_init/tanks_temples
results:
  csv: research_results/hasil_radegs_v2/scaffold_anchor_init/experiment_results_tanks_temples.csv
colmap:
  executable: colmap
  camera_model: OPENCV
  use_gpu: true
training:
  extra_args:
  - --enable_allocator_gc
  - --iterations
  - '30000'
  - --resolution
  - '1920'
  - --eval
rendering:
  enabled: true
  extra_args: []
image_metrics:
  enabled: true
mesh:
  enabled: true
  script: mesh_extract.py
  resolution: 2
  num_cluster: 8
  depth_ratio: 0.5
  voxel_size: 0.009
  max_depth: 8.0
  extra_args: []
resource_monitor:
  interval_seconds: 5.0
resource_guard:
  enabled: true
  cooldown_before_mesh_seconds: 5
  minimum_free_ram_gb: 4
  minimum_free_vram_mb: 1024
  wait_if_memory_low: true
  check_interval_seconds: 10
  max_wait_seconds: 300
geometry_evaluation:
  enabled: true
  gt_root: dataset/ground_truth/tanks_temples
  skip_missing_gt: true
  sample_points: 100000
  distance_threshold: null
  seed: 0
scaffold_initialization:
  enabled: true
  repository: eksperimen/Scaffold-GS
  python_executable: ${SCAFFOLD_PYTHON}
  expected_commit: 59c833b56bbbf510f3f64d40f81721995caced66
  iterations: 30000
  voxel_size: 0.001
  max_color_distance: 0.0
