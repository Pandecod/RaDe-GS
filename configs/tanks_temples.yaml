# Tanks and Temples via RaDe-GS: training 1920, 30000 iterasi, allocator GC, mesh TNT.
project:
  name: RaDe-GS
  dataset: Tanks and Temples
dataset:
  root: /home/pande/projects/RaDe-GS/datasets/tanks_temples
output:
  root: output/tanks_temples
results:
  csv: research_results/experiment_results_tanks_temples.csv
colmap:
  executable: colmap
  camera_model: OPENCV
  use_gpu: true
training:
  extra_args:
    - "--enable_allocator_gc"
    - "--iterations"
    - "30000"
    - "--resolution"
    - "1920"
    - "--profile_training"
    - "--profile_from"
    - "1800"
    - "--profile_until"
    - "30000"
    - "--profile_interval"
    - "100"
    - "--profile_control_samples"
    - "--profile_gpu_interval"
    - "1"
    - "--checkpoint_iterations"
    - "3000"
    - "7000"
    - "15000"
    - "25000"
rendering:
  enabled: true
  extra_args: []
image_metrics:
  enabled: true
mesh:
  enabled: true
  resolution: 2
  num_cluster: 8
  depth_ratio: 0.5
  voxel_size: 0.009
  max_depth: 8.0
  extra_args: []
resource_monitor:
  interval_seconds: 5.0
resource_guard:
  enabled: true
  cooldown_before_mesh_seconds: 5
  minimum_free_ram_gb: 4
  minimum_free_vram_mb: 1024
  wait_if_memory_low: true
  check_interval_seconds: 10
  max_wait_seconds: 300
geometry_evaluation:
  enabled: false
  gt_root: null
  sample_points: 100000
  distance_threshold: null
  seed: 0
